name: update visual baselines

# Run manually (Actions tab > this workflow > Run workflow) after an intentional UI change,
# or once to create the first baselines. It regenerates screenshots on the same Linux runner
# image the visual job compares against, then commits them. Review the images in the diff.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -w tests/e2e -- playwright install --with-deps chromium
      - name: Regenerate screenshots
        run: npm exec -w tests/e2e -- playwright test --project=visual --update-snapshots=all
      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/specs/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            git commit -m "test: update visual baselines"
            git push
          fi
